<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Harian</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ea580c">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --or:#f97316;--or-d:#ea580c;--or-l:#ffedd5;
  --red:#dc2626;--red-l:#fee2e2;
  --grn:#16a34a;--grn-l:#dcfce7;
  --yel:#eab308;--yel-d:#a16207;--yel-l:#fef9c3;
  --bg:#fff7ed;--ink:#2b2118;--mut:#8a7968;--line:#f1dfcc;--card:#fff;
  --sh:0 2px 10px rgba(180,90,20,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(115deg,var(--or) 0%,var(--red) 100%);color:#fff;padding:12px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 3px 14px rgba(220,38,38,.25)}
header h1{font-size:19px;margin:0;flex:1;min-width:130px;letter-spacing:.2px}
header select,header button{font:inherit;padding:7px 10px;border-radius:10px;border:0}
header select{background:#fff;color:var(--ink);max-width:48vw}
header button{background:rgba(255,255,255,.22);color:#fff;font-weight:600}
#tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.04)}
#tabs button{flex:0 0 auto;padding:8px 14px;border:0;background:var(--or-l);font:inherit;font-weight:600;color:var(--or-d);border-radius:20px;cursor:pointer}
#tabs button.on{background:linear-gradient(115deg,var(--or),var(--or-d));color:#fff;box-shadow:0 2px 8px rgba(234,88,12,.4)}
main{padding:14px;max-width:1100px;margin:0 auto}
h3{margin:0 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:var(--sh);border:1px solid var(--line);border-top:5px solid var(--or);position:relative}
.stat b{display:block;font-size:22px;line-height:1.2}.stat span{color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat.g{border-top-color:var(--grn)}.stat.y{border-top-color:var(--yel)}.stat.r{border-top-color:var(--red)}
.stat.r b{color:var(--red)}.stat.g b{color:var(--grn)}
.bar{height:9px;background:#f3e6d8;border-radius:5px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--yel),var(--grn));border-radius:5px}
button,.btn{font:inherit;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink);font-weight:600}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(115deg,var(--or),var(--or-d));color:#fff;border-color:var(--or-d);box-shadow:0 2px 8px rgba(234,88,12,.3)}
button.ok{background:var(--grn);color:#fff;border-color:var(--grn)}button.warn{background:var(--yel);color:#422006;border-color:var(--yel)}button.bad{background:var(--red);color:#fff;border-color:var(--red)}
button.sm{padding:5px 10px;font-size:13px;border-radius:9px}
input,select,textarea{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;max-width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or)}
textarea{width:100%;min-height:90px}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--or-d);padding:0}
label{display:inline-flex;gap:6px;align-items:center}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--sh)}
.toolbar input{flex:1;min-width:150px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.hint{color:var(--mut);font-size:13px}
.legend{font-size:12.5px;color:var(--mut);margin:2px 2px 10px}
/* kartu transaksi */
.tx{background:#fff;border:1px solid var(--line);border-left:7px solid #cbbfb2;border-radius:14px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
.tx.s-wajar{border-left-color:var(--grn)}.tx.s-klarifikasi{border-left-color:var(--yel)}.tx.s-temuan{border-left-color:var(--red)}
.tx-top{padding:10px 12px 4px;cursor:pointer}
.tx-top:hover{background:#fffaf5}
.tx-l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tx-no{font-weight:800;font-size:15px}.tx-date{color:var(--mut);font-size:12.5px}
.tx-amt{margin-left:auto;font-weight:800;font-size:16px;white-space:nowrap;color:var(--or-d)}.tx-amt small{font-weight:600;color:var(--mut);font-size:11px;margin-right:2px}
.tx-l2{font-size:13px;color:#5b4b3c;margin:2px 0 2px}
.tx-l2 .acc{background:var(--or-l);color:var(--or-d);border-radius:8px;padding:0 6px;font-size:11.5px;font-weight:700;margin-left:4px}
.tx-ctl{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px 11px;align-items:center}
.chip{padding:6px 11px;border-radius:20px;border:1.5px solid #e6d6c3;background:#fff;font-size:13px;font-weight:700;color:#8a7968;cursor:pointer;line-height:1.2}
.chip.c0{border-style:dashed}
.chip.c1{background:var(--grn-l);border-color:var(--grn);color:#166534}
.chip.c2{background:var(--red-l);border-color:var(--red);color:#991b1b}
.chip.c3{background:var(--yel-l);border-color:var(--yel);color:var(--yel-d)}
.chip.c4{background:var(--or-l);border-color:var(--or);color:var(--or-d)}
.sep{flex:1}
.stbtn{display:flex;gap:4px}
.stbtn button{padding:6px 10px;border-radius:10px;font-size:12.5px;border:1.5px solid #e6d6c3;color:#8a7968}
.stbtn .s1.on{background:var(--grn);border-color:var(--grn);color:#fff}
.stbtn .s2.on{background:var(--yel);border-color:var(--yel);color:#422006}
.stbtn .s3.on{background:var(--red);border-color:var(--red);color:#fff}
.bd{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin:0 4px 2px 0;color:#fff;font-weight:700}
.bd.g{background:var(--grn)}.bd.y{background:var(--yel);color:#422006}.bd.r{background:var(--red)}.bd.b{background:var(--or)}.bd.n{background:#a79a8c}
.warnbar{background:var(--yel-l);border:1.5px solid var(--yel);color:#713f12;border-radius:14px;padding:10px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner{background:linear-gradient(135deg,#fff,#fff7ed);border-color:var(--or)}
table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{background:var(--or-l);color:var(--or-d);font-size:12px;text-transform:uppercase;letter-spacing:.3px}
td.num,th.num{text-align:right}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.sub button{border-radius:20px;padding:7px 13px}
.sub button.on{background:var(--or-d);color:#fff;border-color:var(--or-d)}
.chips span{display:inline-block;background:var(--or-l);color:#7c2d12;border-radius:8px;padding:2px 8px;margin:2px;font-size:12px;font-weight:600}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:11px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 11px;font-size:13px;background:#fff;color:var(--mut)}
.seg button+button{border-left:1.5px solid var(--line)}
.seg button.on.g{background:var(--grn);color:#fff}.seg button.on.o{background:var(--or);color:#fff}.seg button.on.y{background:var(--yel);color:#422006}
.scard{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-left:6px solid var(--yel);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.scard.p1{border-left-color:var(--grn)}.scard.p0{border-left-color:var(--or)}
.scard .nm{flex:1;min-width:160px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fld{margin:8px 0}.fld>span{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.fld select,.fld input,.fld textarea{width:100%}
.flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.acc-card{border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;background:#fff}
.acc-card .flex{margin:5px 0}
details summary{cursor:pointer;color:var(--or-d);font-weight:700;margin:6px 0}
/* modal */
#modal{position:fixed;inset:0;background:#2b211899;display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.on{display:flex}
#modal .box{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
@media(min-width:700px){#modal{align-items:center}#modal .box{border-radius:20px}}
.mhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}.mhead b{font-size:18px}.mhead .sp{margin-left:auto}
.qa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.qa button{padding:16px 6px;font-size:15px;border-radius:14px}
.mfoot{display:flex;justify-content:space-between;margin-top:12px;gap:8px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2b2118;color:#fff;padding:10px 18px;border-radius:22px;z-index:30;font-size:14px;box-shadow:0 4px 14px #0004}
@media(max-width:560px){main{padding:10px}.tx-amt{font-size:15px}.stbtn button{padding:6px 8px}}
</style>
</head>
<body>
<header>
  <h1>🔎 Audit Harian</h1>
  <select id="projSel" onchange="switchProject(this.value)"></select>
  <button onclick="addProject()">＋ Proyek</button>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<div id="modal" onclick="if(event.target===this)closeM()"><div class="box" id="mbox"></div></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>
'use strict';
/* ====================== util ====================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n===null||n===undefined||n==='')?'':new Intl.NumberFormat('id-ID',{maximumFractionDigits:2}).format(n);
const uid=()=>Math.random().toString(36).slice(2,10);
const normNo=s=>String(s==null?'':s).trim().toUpperCase();
const keyOf=p=>String(p).toUpperCase().replace(/[^A-Z0-9]/g,'');
const BLN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const fmtDate=d=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(d||'');return m?(+m[3])+' '+BLN[+m[2]-1]+' '+m[1]:(d||'')};
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const pad2=n=>String(n).padStart(2,'0');
const MON={jan:1,feb:2,mar:3,apr:4,mei:5,may:5,jun:6,jul:7,agu:8,ags:8,aug:8,sep:9,okt:10,oct:10,nov:11,des:12,dec:12};
const isDateObj=v=>Object.prototype.toString.call(v)==='[object Date]';

function parseNum(v){
  if(typeof v==='number')return isFinite(v)?v:0;
  if(v==null)return 0;
  let s=String(v).trim();if(!s)return 0;
  let neg=/^\(.*\)$/.test(s)||/^-/.test(s)||/-$/.test(s);
  s=s.replace(/[^\d.,]/g,'');if(!s)return 0;
  const dots=(s.match(/\./g)||[]).length,coms=(s.match(/,/g)||[]).length;
  let out;
  if(dots&&coms){const dec=s.lastIndexOf('.')>s.lastIndexOf(',')?'.':',';const th=dec==='.'?',':'.';out=s.split(th).join('').replace(dec,'.')}
  else if(dots>1)out=s.split('.').join('');
  else if(coms>1)out=s.split(',').join('');
  else if(dots===1){out=/^\d{1,3}\.\d{3}$/.test(s)?s.replace('.',''):s}
  else if(coms===1){out=/^\d{1,3},\d{3}$/.test(s)?s.replace(',',''):s.replace(',','.')}
  else out=s;
  const n=parseFloat(out);return isNaN(n)?0:(neg?-n:n);
}
function isoLocal(d){return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())}
function parseDate(v){
  if(v==null||v==='')return '';
  if(isDateObj(v)){if(isNaN(v))return '';return isoLocal(new Date(v.getTime()+12*3600*1000))}
  if(typeof v==='number'){if(v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400*1000));return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate())}return ''}
  const s=String(v).trim();let m;
  if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s)))return m[1]+'-'+pad2(m[2])+'-'+pad2(m[3]);
  if((m=/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/.exec(s))){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(m[2])+'-'+pad2(m[1])}
  if((m=/^(\d{1,2})[\s\-]([A-Za-z]{3,})[a-z]*[\s\-,]+(\d{2,4})/.exec(s))){const mo=MON[m[2].slice(0,3).toLowerCase()];if(mo){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad2(mo)+'-'+pad2(m[1])}}
  return '';
}
function splitNo(no){const m=/^(.*?)(\d+)$/.exec(no);return m?{p:m[1],n:parseInt(m[2],10),w:m[2].length}:{p:no,n:null,w:0}}
const fmtNo=(p,n,w)=>p+String(n).padStart(w,'0');
// baris saldo awal / saldo akhir / total bukan transaksi
const isJunkRow=(no,desc)=>/^\s*(saldo\s*(awal|akhir)|total\b|jumlah\b|grand\s*total)/i.test(String(no||''))||/^\s*(saldo\s*(awal|akhir)|total\b|grand\s*total)/i.test(String(desc||''));

/* ====================== penyimpanan ====================== */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('audit-harian',1);r.onupgradeneeded=()=>{r.result.createObjectStore('projects',{keyPath:'id'});r.result.createObjectStore('meta')};r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  req(store,mode,fn){return new Promise((res,rej)=>{const t=this.db.transaction(store,mode);const r=fn(t.objectStore(store));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  all(){return this.req('projects','readonly',s=>s.getAll())},
  put(p){return this.req('projects','readwrite',s=>s.put(p))},
  del(id){return this.req('projects','readwrite',s=>s.delete(id))},
  getMeta(k){return this.req('meta','readonly',s=>s.get(k))},
  setMeta(k,v){return this.req('meta','readwrite',s=>s.put(v,k))}
};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,350)}
function flush(){clearTimeout(saveT);saveT=null;if(S.p)return DB.put(S.p).catch(e=>toast('Gagal menyimpan: '+e))}
document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
window.addEventListener('pagehide',flush);

/* ====================== state & model ====================== */
const S={projects:[],p:null,tab:'beranda',ms:'perusahaan',f:{q:'',acc:'',st:'',mon:'',sort:'date',lim:100},nav:{ids:[],i:0},att:'',tm:{q:'',why:''},IMP:null,
  sf:{name:'',npwp:'',pkp:null,note:'',edit:-1},sq:'',sfil:''};
const DEFAULT_DOCS=()=>[
  {id:'nota',name:'Nota / kuitansi',pkpOnly:false},{id:'bukti_tf',name:'Bukti transfer',pkpOnly:false},
  {id:'faktur_beli',name:'Faktur pembelian',pkpOnly:false},{id:'faktur_pajak',name:'Faktur pajak',pkpOnly:true},
  {id:'dok_ket',name:'Dokumen keterangan admin',pkpOnly:false}];
const JENIS=['bank','kas kecil','pembelian','biaya','pendapatan','lain'];
const JENIS_DEF={bank:{docs:['nota','bukti_tf'],mode:'all'},'kas kecil':{docs:['nota','dok_ket'],mode:'any'},pembelian:{docs:['faktur_beli','nota','faktur_pajak'],mode:'all'},biaya:{docs:['nota'],mode:'all'}};
const STATUS=[['belum','Belum dicek'],['wajar','Wajar'],['klarifikasi','Perlu klarifikasi'],['temuan','Temuan']];
const DOCCYCLE=['','ada','tidak','sebagian'];
function newProject(name){return{id:uid(),v:2,name,pkp:false,period:'',docTypes:DEFAULT_DOCS(),accounts:[],suppliers:[],
  prefixes:[{p:'PAY-',name:'Bukti kas keluar',wajib:true,dok:true},{p:'REC-',name:'Bukti kas masuk',wajib:true,dok:true},{p:'BIL-',name:'Tagihan pembelian',wajib:true,dok:true}],
  kategori:['Internal','Outsourcing','Harian'],employees:[],attendance:{},txs:[],printed:{},created:Date.now()}}
function migrate(p){
  if((p.v||1)>=2)return false;
  p.suppliers.forEach(s=>{if(s.pkp!==true)s.pkp=null});               // false lama = belum pernah ditentukan
  const before=p.txs.length;p.txs=p.txs.filter(t=>!isJunkRow(t.no,t.desc));  // buang saldo awal/total
  const used=new Set(p.txs.map(t=>keyOf(splitNo(normNo(t.no)).p)));
  p.prefixes=p.prefixes.filter(x=>!(x.name==='(otomatis dari impor)'&&!used.has(keyOf(x.p))));
  p.prefixes.forEach(x=>{if(x.dok===undefined)x.dok=true});
  p.v=2;return true;
}
let TXMAP=new Map();
function reindex(){TXMAP=new Map(S.p.txs.map(t=>[t.id,t]))}
const docType=id=>S.p.docTypes.find(d=>d.id===id);
const getAcc=t=>S.p.accounts.find(a=>a.key===t.acc);
const getSup=t=>t.sup?S.p.suppliers.find(s=>s.name.toLowerCase()===t.sup.toLowerCase()):null;
function prefixRule(no){const k=keyOf(splitNo(no).p);const r=S.p.prefixes.find(x=>keyOf(x.p)===k);return r?{wajib:!!r.wajib,dok:r.dok!==false,known:true}:{wajib:true,dok:true,known:false}}
const isPrinted=no=>!!S.p.printed[normNo(no)];
function applicableDocs(t){
  const a=getAcc(t);if(!a)return[];
  if(t.no&&!prefixRule(normNo(t.no)).dok)return[];
  const sup=getSup(t);
  return a.docs.map(docType).filter(Boolean).filter(d=>!d.pkpOnly||(S.p.pkp&&(sup?sup.pkp!==false:true)));
}
function docStatus(t){
  const app=applicableDocs(t);if(!app.length)return'-';
  const a=getAcc(t);const vals=app.map(d=>t.docs[d.id]||'');
  const ok=a.mode==='any'?vals.some(v=>v==='ada'):vals.every(v=>v==='ada');
  if(ok)return'lengkap';
  if(vals.every(v=>v===''))return'belum';
  if(vals.some(v=>v==='tidak'||v==='sebagian'))return'kurang';
  return'proses';
}
function selisih(t){return(t.notaAmount!=null&&Math.abs(t.notaAmount-t.amount)>0.5)?t.notaAmount-t.amount:0}
// status otomatis: hanya menimpa bila belum pernah diatur manual
function autoStatus(t){
  if(!(!t.status||t.status==='belum'||t.auto))return;
  const ds=docStatus(t),sel=selisih(t);
  if(sel||ds==='kurang'){t.status='klarifikasi';t.auto=true}
  else if(ds==='lengkap'){t.status='wajar';t.auto=true}
  else{t.status='belum';delete t.auto}
}
function applyOk(t){
  const app=applicableDocs(t),a=getAcc(t);
  if(app.length){if(a.mode==='any'){if(!app.some(d=>t.docs[d.id]==='ada'))t.docs[app[0].id]='ada'}else app.forEach(d=>t.docs[d.id]='ada')}
  t.notaAmount=null;t.status='wajar';delete t.auto;
}
function reasons(t){
  const r=[];
  if(t.status==='temuan')r.push('Status: temuan');
  if(t.status==='klarifikasi')r.push('Perlu klarifikasi');
  const s=selisih(t);if(s)r.push('Selisih nota '+(s>0?'+':'')+rp(s));
  if(docStatus(t)==='kurang')r.push('Dokumen kurang');
  if(t.no&&prefixRule(t.no).wajib&&!isPrinted(t.no))r.push('Belum ada cetakan');
  return r;
}
function txMonth(t){return(t.date||'').slice(0,7)}

/* ====================== analisis nomor cetak ====================== */
function cetakAnalysis(){
  const by={};const g=(p,w)=>by[p]||(by[p]={p,w:w||0,ledger:new Set(),printed:new Set()});
  S.p.txs.forEach(t=>{const no=normNo(t.no);if(!no)return;const s=splitNo(no);if(s.n===null)return;const o=g(s.p,s.w);if(!o.w)o.w=s.w;o.ledger.add(no)});
  Object.keys(S.p.printed).forEach(no=>{const s=splitNo(no);const o=g(s.p,s.w);if(!o.w)o.w=s.w;o.printed.add(no)});
  const out=[];
  Object.values(by).sort((a,b)=>a.p.localeCompare(b.p)).forEach(o=>{
    const rule=prefixRule(o.p+'0');
    const belum=rule.wajib?[...o.ledger].filter(n=>!o.printed.has(n)).sort():[];
    const extra=[...o.printed].filter(n=>!o.ledger.has(n)).sort();
    const nums=[...new Set([...o.ledger,...o.printed].map(n=>splitNo(n).n).filter(n=>n!==null))].sort((a,b)=>a-b);
    const gaps=[];
    for(let i=1;i<nums.length;i++){const a=nums[i-1]+1,b=nums[i]-1;if(b>=a&&b-a<5000)gaps.push(a===b?fmtNo(o.p,a,o.w):fmtNo(o.p,a,o.w)+' – '+fmtNo(o.p,b,o.w))}
    out.push({p:o.p,known:rule.known,wajib:rule.wajib,ledger:o.ledger.size,printed:o.printed.size,belum,extra,gaps});
  });
  return out;
}
function parsePrinted(text){
  const add=new Set();const errs=[];
  String(text).split(/\n/).forEach(line=>{
    line=line.trim();if(!line)return;
    const parts=line.split(/kecuali/i);
    const exc=new Set((parts[1]||'').split(/[,;\s]+/).map(normNo).filter(Boolean));
    const lineSet=new Set();
    parts[0].split(/[,;]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
      const m=/^(\S+)\s*(?:s\/d|s\.d\.?|sd|sampai|\.\.\.?|~|–|—)\s*(\S+)$/i.exec(tok);
      if(m){
        const A=splitNo(normNo(m[1]));let Bs=normNo(m[2]);let B=/^\d+$/.test(Bs)?{p:A.p,n:parseInt(Bs,10),w:Bs.length}:splitNo(Bs);
        if(A.n===null||B.n===null||A.p!==B.p){errs.push(tok);return}
        if(B.n<A.n||B.n-A.n>20000){errs.push(tok);return}
        for(let n=A.n;n<=B.n;n++)lineSet.add(fmtNo(A.p,n,A.w));
      }else{tok.split(/\s+/).forEach(x=>lineSet.add(normNo(x)))}
    });
    lineSet.forEach(n=>{if(!exc.has(n))add.add(n)});
  });
  return{add,errs};
}

function badges(t){

function filtered(){
  const f=S.f,q=f.q.trim().toLowerCase();
  let r=S.p.txs.filter(t=>{
    if(f.acc&&t.acc!==f.acc)return false;if(f.mon&&txMonth(t)!==f.mon)return false;
    if(q&&!((t.no+' '+t.desc+' '+t.sup+' '+t.acc).toLowerCase().includes(q)))return false;
    const st=t.status||'belum';
    if(f.st==='dokkurang')return docStatus(t)==='kurang';
    if(f.st==='selisih')return !!selisih(t);
    if(f.st==='belumcetak')return t.no&&prefixRule(t.no).wajib&&!isPrinted(t.no);
    if(f.st&&st!==f.st)return false;
    return true;
  });
  if(f.sort==='amt')r.sort((a,b)=>b.amount-a.amount);else if(f.sort==='no')r.sort((a,b)=>a.no.localeCompare(b.no,undefined,{numeric:true}));else r.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||a.no.localeCompare(b.no,undefined,{numeric:true}));
  return r;
}

function refreshRow(id){const t=TXMAP.get(id),el=document.getElementById('r_'+id);if(t&&el)el.outerHTML=rowHtml(t)}
function cycleDoc(id,docId){const t=TXMAP.get(id);const i=DOCCYCLE.indexOf(t.docs[docId]||'');const v=DOCCYCLE[(i+1)%DOCCYCLE.length];if(v)t.docs[docId]=v;else delete t.docs[docId];autoStatus(t);save();refreshRow(id)}
function setStatus(id,v){const t=TXMAP.get(id);t.status=(t.status===v)?'belum':v;delete t.auto;save();refreshRow(id)}
function togPrintedRow(id){const t=TXMAP.get(id),no=normNo(t.no);if(S.p.printed[no])delete S.p.printed[no];else S.p.printed[no]=1;save();S.p.txs.filter(x=>normNo(x.no)===no).forEach(x=>refreshRow(x.id))}

function bulkOk(){

  if(!L.length){toast('Tidak ada transaksi "belum dicek" pada tampilan ini');return}
  if(!confirm('Tandai SESUAI (semua dokumen ada, status Wajar) untuk '+L.length+' transaksi yang belum dicek pada tampilan ini?\n\nPastikan Anda sudah memeriksa dokumennya.'))return;
  L.forEach(applyOk);save();renderList();toast(L.length+' transaksi ditandai sesuai');
}
function renderList(){
  const L=$('#list');if(!L)return;const r=filtered();
  $('#cnt').textContent=r.length+' transaksi'+(r.length>S.f.lim?' (menampilkan '+S.f.lim+' pertama)':'');

function startQuick(){
  if(!S.p.txs.length){toast('Belum ada transaksi');return}
  let ids=filtered().filter(t=>!t.status||t.status==='belum').map(t=>t.id);
  if(!ids.length)ids=filtered().map(t=>t.id);
  if(!ids.length){toast('Tidak ada transaksi pada filter ini');return}
  S.nav={ids,i:0};showTx(false);
}
function openTx(id){const ids=filtered().map(t=>t.id);S.nav={ids,i:Math.max(0,ids.indexOf(id))};showTx(true)}
function curTx(){return TXMAP.get(S.nav.ids[S.nav.i])}

  const t=curTx();if(!t){closeM();return}
  const app=applicableDocs(t),a=getAcc(t);const sel=selisih(t);
  const rule=t.no?prefixRule(t.no):{wajib:false};

  <details ${detOpen?'open':''}><summary>Rincian pemeriksaan</summary>

function closeM(){$('#modal').classList.remove('on');flush();if(S.tab==='transaksi')renderList();else render()}
function navTx(d){const i=S.nav.i+d;if(i<0||i>=S.nav.ids.length){if(d>0){toast('Selesai — itu transaksi terakhir');closeM()}return}S.nav.i=i;showTx(false)}
function setDoc(id,v){const t=curTx();if(v)t.docs[id]=v;else delete t.docs[id];autoStatus(t);save();showTx(true)}
function setNota(v){const t=curTx();t.notaAmount=String(v).trim()===''?null:parseNum(v);autoStatus(t);save();showTx(true)}
function setF(k,v){const t=curTx();t[k]=v;if(k==='status')delete t.auto;save();if(k==='status')showTx(true)}
function togPrinted(c){const t=curTx(),no=normNo(t.no);if(c)S.p.printed[no]=1;else delete S.p.printed[no];save();showTx(true)}
function quick(kind){
  const t=curTx(),app=applicableDocs(t);
  if(kind==='ok')applyOk(t);
  else if(kind==='diff'){
    const v=prompt('Nominal di nota/dokumen (Rp), sistem: '+rp(t.amount));if(v===null)return;
    t.notaAmount=parseNum(v);if(!t.status||t.status==='belum'||t.status==='wajar')t.status='klarifikasi';delete t.auto;
    app.forEach(d=>{if(!t.docs[d.id])t.docs[d.id]='ada'});
  }else{app.forEach(d=>t.docs[d.id]='tidak');t.status='temuan';delete t.auto}
  save();
  if(S.nav.i<S.nav.ids.length-1){S.nav.i++;showTx(false)}else{toast('Semua pada daftar ini sudah diproses');closeM()}
}

  return`<div class="card"><h3>🖨 Catat nomor yang ada cetakannya</h3>
   <p class="hint">Satu baris satu entri. Contoh: <code>PAY-00001 sampai PAY-00120 kecuali PAY-00045, PAY-00050</code> atau daftar nomor dipisah koma. Format rentang: <code>A sampai B</code>, <code>A s/d B</code>, <code>A...B</code>. Anda juga bisa menandai cetakan satu per satu lewat chip 🖨 di tab Transaksi.</p>
   <textarea id="ptxt" placeholder="PAY-00001 sampai PAY-00120 kecuali PAY-00045&#10;REC-000001 s/d REC-000040&#10;BIL-00007, BIL-00009"></textarea>
   <div class="flex" style="margin-top:8px"><button class="pri" onclick="addPrinted()">＋ Tandai dicetak</button><button onclick="remPrinted()">Hapus dari daftar cetak</button><button class="bad sm" onclick="clearPrinted()">Kosongkan semua</button></div></div>
  <div class="card"><h3>Ringkasan per awalan nomor</h3>${A.length?`<table><tr><th>Awalan</th><th class="num">Di buku besar</th><th class="num">Dicetak</th><th>Wajib cetak</th><th class="num">Belum cetak</th><th class="num">Cetak tanpa buku</th><th class="num">Loncat</th></tr>
   ${A.map(o=>`<tr><td><b>${esc(o.p)}</b>${o.known?'':' <span class="bd y">belum terdaftar</span>'}</td><td class="num">${o.ledger}</td><td class="num">${o.printed}</td><td>${o.wajib?'Ya':'Tidak'}</td><td class="num">${o.belum.length?`<span class="bd y">${o.belum.length}</span>`:0}</td><td class="num">${o.extra.length?`<span class="bd r">${o.extra.length}</span>`:0}</td><td class="num">${o.gaps.length?`<span class="bd r">${o.gaps.length}</span>`:0}</td></tr>`).join('')}</table>`:'<p class="hint">Belum ada nomor bukti. Impor buku besar dulu.</p>'}
   <p class="hint">Atur awalan mana yang wajib dicetak (mis. penjualan internal tidak wajib) di Data Master › Awalan nomor.</p></div>
  ${A.map(o=>`<details class="card"><summary><b>${esc(o.p)}</b> — belum cetak ${o.belum.length}, cetak tanpa buku ${o.extra.length}, loncat ${o.gaps.length}</summary>
    ${o.belum.length?`<h4>Ada di buku besar, tidak ada cetakannya</h4>${chips(o.belum)}`:''}
    ${o.extra.length?`<h4>Ada cetakan, tidak ada di buku besar</h4>${chips(o.extra)}`:''}
    ${o.gaps.length?`<h4>Nomor loncat (tidak ada di buku maupun cetakan)</h4>${chips(o.gaps)}`:''}
    ${(!o.belum.length&&!o.extra.length&&!o.gaps.length)?'<p class="hint">Tidak ada temuan.</p>':''}</details>`).join('')}`;
};
function addPrinted(){const {add,errs}=parsePrinted($('#ptxt').value);add.forEach(n=>S.p.printed[n]=1);save();toast(add.size+' nomor ditandai dicetak'+(errs.length?' · tidak terbaca: '+errs.join(', '):''));render()}
function remPrinted(){const {add}=parsePrinted($('#ptxt').value);add.forEach(n=>delete S.p.printed[n]);save();toast(add.size+' nomor dihapus dari daftar cetak');render()}
function clearPrinted(){if(confirm('Kosongkan semua daftar nomor cetak?')){S.p.printed={};save();render()}}

/* ---- Temuan ---- */
function findings(){
  const w=S.tm.why,q=S.tm.q.trim().toLowerCase();
  return S.p.txs.map(t=>({t,r:reasons(t)})).filter(x=>x.r.length).filter(x=>{
    if(w&&!x.r.some(s=>s.startsWith(w)))return false;
    if(q&&!((x.t.no+' '+x.t.desc+' '+x.t.sup).toLowerCase().includes(q)))return false;return true;
  });
}
VIEWS.temuan=()=>{
  const F=findings();
  return`<div class="toolbar"><input placeholder="🔍 Cari" value="${esc(S.tm.q)}" oninput="S.tm.q=this.value;render()">
   <select onchange="S.tm.why=this.value;render()">${[['','Semua alasan'],['Status: temuan','Status temuan'],['Perlu klarifikasi','Perlu klarifikasi'],['Selisih','Selisih nota'],['Dokumen kurang','Dokumen kurang'],['Belum ada cetakan','Belum ada cetakan']].map(([v,n])=>`<option value="${v}" ${S.tm.why===v?'selected':''}>${n}</option>`).join('')}</select>
   <button class="pri" onclick="exportXlsx()">⬇ Ekspor Excel</button></div>
   <div class="hint" style="margin-bottom:8px">${F.length} transaksi bermasalah. Ketuk untuk membuka dan memperbarui.</div>
   ${F.slice(0,300).map(({t,r})=>`<div class="tx s-${t.status||'belum'}" onclick="openFinding('${t.id}')" style="cursor:pointer"><div class="tx-top"><div class="tx-l1"><span class="tx-no">${esc(t.no)}</span><span class="tx-date">${esc(fmtDate(t.date))}</span><span class="tx-amt"><small>Rp</small>${rp(t.amount)}</span></div><div class="tx-l2">${esc(t.desc)}${t.sup?' · <b>'+esc(t.sup)+'</b>':''}</div><div>${r.map(x=>`<span class="bd ${x.startsWith('Belum')?'y':'r'}">${esc(x)}</span>`).join('')}</div>${t.note?`<div class="hint">📝 ${esc(t.note)}</div>`:''}</div></div>`).join('')}
   ${F.length>300?'<p class="hint">Menampilkan 300 pertama; ekspor Excel memuat semuanya.</p>':''}`;
};
function openFinding(id){const ids=findings().map(x=>x.t.id);S.nav={ids,i:Math.max(0,ids.indexOf(id))};showTx(true)}

/* supplier: form + daftar */
const pkpSeg=(cur,fn)=>`<div class="seg"><button class="${cur===true?'on g':''}" onclick="${fn}(true)">PKP</button><button class="${cur===false?'on o':''}" onclick="${fn}(false)">Non-PKP</button><button class="${cur==null?'on y':''}" onclick="${fn}(null)">Belum tahu</button></div>`;
MV.supplier=()=>{
  const f=S.sf,editing=f.edit>=0;
  return`<div class="card banner"><h3>${editing?'✏ Ubah supplier':'＋ Tambah supplier'}</h3>
   <div class="formgrid"><div class="fld"><span>Nama supplier *</span><input value="${esc(f.name)}" oninput="S.sf.name=this.value" placeholder="mis. PT Arta Boga Cermelang"></div>
   <div class="fld"><span>NPWP (opsional)</span><input value="${esc(f.npwp)}" oninput="S.sf.npwp=this.value" inputmode="numeric" placeholder="00.000.000.0-000.000"></div></div>
   <div class="fld"><span>Status PKP</span>${pkpSeg(f.pkp,'sfPkp')}<div class="hint" style="margin-top:4px">PKP → faktur pajak wajib dicek. Non-PKP → faktur pajak tidak diminta. Belum tahu → tetap diminta supaya tidak terlewat.</div></div>
   <div class="fld"><span>Catatan (opsional)</span><input value="${esc(f.note)}" oninput="S.sf.note=this.value"></div>
   <div class="flex"><button class="pri" onclick="saveSup()">💾 ${editing?'Simpan perubahan':'Simpan supplier'}</button>${editing?'<button onclick="cancelSup()">Batal</button>':''}<button onclick="bulkSup()">Tempel banyak nama</button></div></div>
  <div class="card"><div class="toolbar" style="box-shadow:none;border:0;padding:0"><input placeholder="🔍 Cari supplier" value="${esc(S.sq)}" oninput="S.sq=this.value;renderSupList()">
   <select onchange="S.sfil=this.value;renderSupList()">${[['','Semua status'],['u','Belum ditentukan'],['p','PKP'],['n','Non-PKP']].map(([v,n])=>`<option value="${v}" ${S.sfil===v?'selected':''}>${n}</option>`).join('')}</select></div>
   <div class="hint" id="supcnt" style="margin:6px 0"></div><div id="suplist"></div></div>`;
};
function renderSupList(){
  const L=$('#suplist');if(!L)return;
  const cnt={};S.p.txs.forEach(t=>{if(t.sup){const k=t.sup.toLowerCase();cnt[k]=(cnt[k]||0)+1}});
  const q=S.sq.trim().toLowerCase();
  const arr=S.p.suppliers.map((s,i)=>({s,i})).filter(({s})=>(!q||s.name.toLowerCase().includes(q))&&(!S.sfil||(S.sfil==='u'&&s.pkp==null)||(S.sfil==='p'&&s.pkp===true)||(S.sfil==='n'&&s.pkp===false)))
    .sort((a,b)=>(a.s.pkp==null?0:1)-(b.s.pkp==null?0:1)||a.s.name.localeCompare(b.s.name));
  const unk=S.p.suppliers.filter(s=>s.pkp==null).length;
  $('#supcnt').textContent=S.p.suppliers.length+' supplier · '+unk+' belum ditentukan statusnya'+(arr.length!==S.p.suppliers.length?' · '+arr.length+' tampil':'');
  L.innerHTML=arr.map(({s,i})=>`<div class="scard ${s.pkp===true?'p1':s.pkp===false?'p0':''}"><div class="nm"><b>${esc(s.name)}</b><div class="hint">${s.npwp?'NPWP '+esc(s.npwp)+' · ':''}${cnt[s.name.toLowerCase()]||0} transaksi${s.note?' · '+esc(s.note):''}</div></div>${pkpSeg(s.pkp,'supPkp.bind(null,'+i+')')}<button class="sm" onclick="editSup(${i})">Ubah</button><button class="sm bad" onclick="delSup(${i})">Hapus</button></div>`).join('')||'<p class="hint">Belum ada supplier yang cocok.</p>';
}
function sfPkp(v){S.sf.pkp=v;render()}
function supPkp(i,v){S.p.suppliers[i].pkp=v;save();renderSupList();S.p.txs.forEach(t=>{if(t.sup&&t.sup.toLowerCase()===S.p.suppliers[i].name.toLowerCase())autoStatus(t)})}
function saveSup(){
  const f=S.sf,name=f.name.trim();if(!name){toast('Isi nama supplier dulu');return}
  const dupe=S.p.suppliers.findIndex((s,i)=>s.name.toLowerCase()===name.toLowerCase()&&i!==f.edit);
  if(dupe>=0&&f.edit<0){S.p.suppliers[dupe]={...S.p.suppliers[dupe],npwp:f.npwp.trim(),pkp:f.pkp,note:f.note.trim()};toast('Supplier sudah ada, datanya diperbarui')}
  else if(f.edit>=0){S.p.suppliers[f.edit]={...S.p.suppliers[f.edit],name,npwp:f.npwp.trim(),pkp:f.pkp,note:f.note.trim()};toast('Perubahan disimpan')}
  else{S.p.suppliers.push({name,npwp:f.npwp.trim(),pkp:f.pkp,note:f.note.trim()});toast('Supplier ditambahkan')}
  S.sf={name:'',npwp:'',pkp:null,note:'',edit:-1};save();render();
}
function editSup(i){const s=S.p.suppliers[i];S.sf={name:s.name,npwp:s.npwp||'',pkp:s.pkp==null?null:s.pkp,note:s.note||'',edit:i};render();window.scrollTo(0,0)}
function cancelSup(){S.sf={name:'',npwp:'',pkp:null,note:'',edit:-1};render()}
function bulkSup(){const t=prompt('Tempel nama supplier, pisahkan dengan titik koma (;). Statusnya Belum tahu dulu:');if(!t)return;const ex=new Set(S.p.suppliers.map(s=>s.name.toLowerCase()));t.split(/[;\n]/).map(x=>x.trim()).filter(Boolean).forEach(n=>{if(!ex.has(n.toLowerCase())){S.p.suppliers.push({name:n,npwp:'',pkp:null,note:''});ex.add(n.toLowerCase())}});save();render()}
function delSup(i){if(!confirm('Hapus supplier “'+S.p.suppliers[i].name+'”?'))return;S.p.suppliers.splice(i,1);save();render()}

MV.prefix=()=>`<div class="card"><p class="hint">Awalan nomor bukti (mis. PAY-, REC-, CP-, SP-). <b>Wajib cetak</b>: nomor ini diperiksa kelengkapan cetakannya. <b>Cek dokumen</b>: chip dokumen muncul untuk nomor ini (matikan untuk jenis yang tidak butuh nota, mis. penerimaan atau penjualan internal).</p>

MV.karyawan=()=>`<div class="card"><div class="bar2"><button class="pri" onclick="addEmp()">＋ Tambah karyawan</button><button onclick="bulkEmp()">Tempel banyak nama</button><button onclick="addKat()">＋ Kategori baru</button></div>
 <p class="hint">Kategori: ${S.p.kategori.map(esc).join(', ')}</p>
 ${S.p.employees.length?`<table><tr><th>Nama</th><th>Kategori</th><th>Aktif</th><th></th></tr>${S.p.employees.map((e,i)=>`<tr><td><input value="${esc(e.name)}" onchange="arrSet('employees',${i},'name',this.value)"></td><td><select onchange="arrSet('employees',${i},'kat',this.value)">${S.p.kategori.map(k=>`<option ${e.kat===k?'selected':''}>${esc(k)}</option>`).join('')}</select></td><td><input type="checkbox" ${e.aktif!==false?'checked':''} onchange="arrSet('employees',${i},'aktif',this.checked)"></td><td><button class="sm bad" onclick="delEmp(${i})">Hapus</button></td></tr>`).join('')}</table>`:'<p class="hint">Belum ada karyawan.</p>'}</div>`;
function addEmp(){const n=prompt('Nama karyawan:');if(!n)return;S.p.employees.push({id:uid(),name:n.trim(),kat:S.p.kategori[0],aktif:true});save();render()}
function bulkEmp(){const t=prompt('Tempel nama karyawan, pisahkan dengan titik koma (;) — kategori awal: '+S.p.kategori[0]);if(!t)return;t.split(/[;\n]/).map(x=>x.trim()).filter(Boolean).forEach(n=>S.p.employees.push({id:uid(),name:n,kat:S.p.kategori[0],aktif:true}));save();render()}
function addKat(){const k=prompt('Nama kategori karyawan:');if(!k||S.p.kategori.includes(k.trim()))return;S.p.kategori.push(k.trim());save();render()}
function delEmp(i){const e=S.p.employees[i];if(!confirm('Hapus '+e.name+' (dan catatan kehadirannya)?'))return;Object.values(S.p.attendance).forEach(m=>delete m[e.id]);S.p.employees.splice(i,1);save();render()}
MV.hadir=()=>{
  const m=S.att||new Date().toISOString().slice(0,7);const cur=S.p.attendance[m]||{};
  const act=S.p.employees.filter(e=>e.aktif!==false);const cnt={};let tot=0;
  S.p.employees.forEach(e=>{if(cur[e.id]){cnt[e.kat]=(cnt[e.kat]||0)+1;tot++}});
  const months=Object.keys(S.p.attendance).sort();
  return`<div class="card"><div class="bar2"><input type="month" value="${m}" onchange="S.att=this.value;render()"><button onclick="copyPrevAtt('${m}')">Salin dari bulan sebelumnya</button><button onclick="allAtt('${m}',true)">Centang semua</button><button onclick="allAtt('${m}',false)">Kosongkan</button></div>
  <div class="hint">Ada di bulan ${m}: <b>${tot}</b> orang${Object.keys(cnt).length?' ('+Object.entries(cnt).map(([k,v])=>esc(k)+' '+v).join(', ')+')':''}</div>
  ${act.length?act.map(e=>`<div style="padding:3px 0"><label><input type="checkbox" ${cur[e.id]?'checked':''} onchange="togAtt('${m}','${e.id}',this.checked)"> ${esc(e.name)} <span class="hint">· ${esc(e.kat)}</span></label></div>`).join(''):'<p class="hint">Tambah karyawan dulu di sub-tab Karyawan.</p>'}</div>
  ${months.length?`<div class="card"><h3>Rekap jumlah karyawan per bulan</h3><table><tr><th>Bulan</th><th class="num">Total</th>${S.p.kategori.map(k=>`<th class="num">${esc(k)}</th>`).join('')}</tr>${months.map(mm=>{const a=S.p.attendance[mm];const c={};let t=0;S.p.employees.forEach(e=>{if(a[e.id]){c[e.kat]=(c[e.kat]||0)+1;t++}});return`<tr><td>${mm}</td><td class="num"><b>${t}</b></td>${S.p.kategori.map(k=>`<td class="num">${c[k]||0}</td>`).join('')}</tr>`}).join('')}</table></div>`:''}`;
};
function togAtt(m,id,c){const a=S.p.attendance[m]||(S.p.attendance[m]={});if(c)a[id]=1;else delete a[id];save();render()}
function allAtt(m,c){const a=S.p.attendance[m]={};if(c)S.p.employees.filter(e=>e.aktif!==false).forEach(e=>a[e.id]=1);save();render()}
function copyPrevAtt(m){const ks=Object.keys(S.p.attendance).filter(k=>k<m).sort();if(!ks.length){toast('Belum ada bulan sebelumnya');return}S.p.attendance[m]={...S.p.attendance[ks[ks.length-1]]};save();render()}

VIEWS.impor=()=>{
  const I=S.IMP;let imp='';
  if(I){
    const aoa=I.sheets[I.sheet]||[];const hdr=aoa[I.hdr-1]||[];const cols=hdr.map((h,i)=>String(h===''||h==null?'Kolom '+(i+1):h));
    const opt=k=>`<select onchange="S.IMP.map.${k}=+this.value;render()"><option value="-1">— tidak ada —</option>${cols.map((c,i)=>`<option value="${i}" ${I.map[k]===i?'selected':''}>${esc(c)}</option>`).join('')}</select>`;
    const F=[['date','Tanggal'],['no','No bukti'],['desc','Keterangan'],['accCode','Kode akun'],['accName','Nama akun'],['sup','Supplier / pihak'],['debit','Debit (keluar)'],['credit','Kredit (masuk)'],['amount','Nominal tunggal']];
    imp=`<div class="card"><h3>2. Pemetaan kolom — ${esc(I.name)}</h3>
     <div class="flex">${Object.keys(I.sheets).length>1?`<label>Sheet <select onchange="S.IMP.sheet=this.value;autoMap();render()">${Object.keys(I.sheets).map(s=>`<option ${s===I.sheet?'selected':''}>${esc(s)}</option>`).join('')}</select></label>`:''}
     <label>Baris judul kolom <input type="number" min="1" value="${I.hdr}" style="width:70px" onchange="S.IMP.hdr=+this.value;autoMap();render()"></label></div>
     <div class="formgrid">${F.map(([k,n])=>`<div class="fld"><span>${n}</span>${opt(k)}</div>`).join('')}</div>
     <p class="hint">Pakai “Debit/Kredit” bila ada dua kolom, atau “Nominal tunggal” bila hanya satu kolom jumlah. Akun cukup salah satu (kode atau nama). Baris “Saldo awal/akhir” dan “Total” dilewati otomatis.</p>
     <div class="fld"><span>Pratinjau 5 baris pertama</span><div style="overflow:auto"><table>${aoa.slice(I.hdr,I.hdr+5).map(r=>`<tr>${cols.map((c,i)=>`<td>${esc(isDateObj(r[i])?parseDate(r[i]):r[i])}</td>`).join('')}</tr>`).join('')}</table></div></div>
     <div class="fld"><span>Mode impor</span><select id="impMode"><option value="add">Tambahkan yang baru saja (lewati yang sudah ada)</option><option value="replace">Ganti semua (hapus transaksi lama beserta hasil pemeriksaan)</option></select></div>
     <button class="pri" onclick="doImport()">📥 Impor transaksi</button></div>`;
  }
  return`<div class="card"><h3>1. Impor buku besar</h3><p class="hint">File Excel (.xlsx/.xls) atau CSV. Diproses di perangkat ini saja, tidak dikirim ke mana pun.</p><input type="file" accept=".xlsx,.xls,.csv,.txt" onchange="loadFile(this.files[0])"></div>${imp}
  <div class="card"><h3>💾 Backup & pemulihan</h3><div class="flex"><button class="pri" onclick="exportJson()">⬇ Backup proyek ini (.json)</button><label class="btn">⬆ Pulihkan dari backup<input type="file" accept=".json" hidden onchange="importJson(this.files[0])"></label></div>
  <p class="hint">File backup berisi data klien — simpan di tempat aman, jangan ikut diunggah ke GitHub. Data hanya tersimpan di browser perangkat ini; membersihkan data situs akan menghapusnya.</p></div>
  <div class="card"><h3>🗑 Hapus data</h3><div class="flex"><button class="bad" onclick="wipeTx()">Hapus semua transaksi & hasil pemeriksaan</button><button class="bad" onclick="delProject()">Hapus proyek ini</button></div></div>`;
};
async function loadFile(f){
  if(!f)return;
  try{
    let wb;const isCsv=/\.(csv|txt)$/i.test(f.name);
    if(isCsv)wb=XLSX.read(await f.text(),{type:'string',raw:true});
    else wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true});
    const sheets={};wb.SheetNames.forEach(n=>sheets[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''}));
    S.IMP={name:f.name,sheets,sheet:wb.SheetNames[0],hdr:1,map:{}};autoMap();render();
  }catch(e){toast('Gagal membaca file: '+e.message)}
}
function autoMap(){
  const I=S.IMP,aoa=I.sheets[I.sheet]||[];
  const hdr=(aoa[I.hdr-1]||[]).map(h=>String(h==null?'':h).toLowerCase().trim());
  const find=(...re)=>{for(const r of re){const i=hdr.findIndex(h=>r.test(h));if(i>=0)return i}return -1};
  I.map={date:find(/tanggal|tgl|date/),no:find(/no\.?\s*bukti|nomor\s*bukti|no\.?\s*voucher|voucher|no\.?\s*ref|nomor|^no\b|ref/),desc:find(/keterangan|uraian|deskripsi|description|memo|narasi/),
   accCode:find(/kode\s*akun|account\s*code|kode\s*coa|^kode$|coa/),accName:find(/nama\s*akun|account\s*name|^akun$|^account$/),sup:find(/supplier|vendor|pemasok|pihak|nama\s*pihak|penerima|dibayar/),
   debit:find(/debit|debet|keluar|pengeluaran/),credit:find(/kredit|credit|masuk|penerimaan/),amount:find(/nominal|jumlah|amount|nilai/)};
  if(I.map.debit>=0||I.map.credit>=0)I.map.amount=-1;
}
function doImport(){
  const I=S.IMP,m=I.map,aoa=I.sheets[I.sheet];
  if(m.date<0&&m.no<0){alert('Pilih minimal kolom Tanggal atau No bukti.');return}
  if(m.debit<0&&m.credit<0&&m.amount<0){alert('Pilih kolom Debit/Kredit atau Nominal tunggal.');return}
  if(m.accCode<0&&m.accName<0&&!confirm('Tidak ada kolom akun. Semua transaksi akan masuk akun “(tanpa akun)”. Lanjut?'))return;
  const mode=$('#impMode').value;if(mode==='replace'&&S.p.txs.length&&!confirm('Hapus '+S.p.txs.length+' transaksi lama beserta hasil pemeriksaannya?'))return;
  const cell=(r,k)=>m[k]>=0?r[m[k]]:'';
  const sig=t=>[t.date,normNo(t.no),t.amount,t.desc].join('|');
  if(mode==='replace')S.p.txs=[];
  const seen=new Set(S.p.txs.map(sig));let added=0,skipped=0,dup=0,newAcc=0,newSup=0,newPre=0,saldo=0;
  for(const r of aoa.slice(I.hdr)){
    const date=parseDate(cell(r,'date')),no=normNo(cell(r,'no')),desc=String(cell(r,'desc')||'').trim();
    if(isJunkRow(no,desc)){saldo++;continue}
    const d=m.debit>=0?parseNum(r[m.debit]):0,c=m.credit>=0?parseNum(r[m.credit]):0;
    let amount=m.amount>=0?Math.abs(parseNum(r[m.amount])):(d&&c?Math.abs(d-c):(d||c));amount=Math.abs(amount);
    if((!no&&!desc&&!date)||(!amount)||(!date&&!no)){skipped++;continue}
    const code=String(cell(r,'accCode')||'').trim(),aname=String(cell(r,'accName')||'').trim();
    const key=code||aname||'(tanpa akun)';
    if(!S.p.accounts.some(a=>a.key===key)){S.p.accounts.push({key,name:code?aname:'',jenis:'lain',docs:[],mode:'all'});newAcc++}
    else{const a=S.p.accounts.find(a=>a.key===key);if(code&&aname&&!a.name)a.name=aname}
    const sup=String(cell(r,'sup')||'').trim();
    if(sup&&!S.p.suppliers.some(s=>s.name.toLowerCase()===sup.toLowerCase())){S.p.suppliers.push({name:sup,npwp:'',pkp:null,note:''});newSup++}
    if(no){const sp=splitNo(no);const k=keyOf(sp.p);if(sp.n!==null&&k&&!S.p.prefixes.some(x=>keyOf(x.p)===k)){S.p.prefixes.push({p:sp.p,name:'(otomatis dari impor)',wajib:true,dok:true});newPre++}}
    const t={id:uid(),date,no,desc,acc:key,sup,debit:d,credit:c,amount,docs:{},notaAmount:null,status:'belum',note:''};
    const s=sig(t);if(seen.has(s)){dup++;continue}seen.add(s);S.p.txs.push(t);added++;
  }
  reindex();flush();S.IMP=null;
  alert(`Impor selesai.\nDitambahkan: ${added}\nDilewati (sudah ada): ${dup}\nDilewati (saldo awal/akhir & total): ${saldo}\nDilewati (baris kosong): ${skipped}\nAkun baru: ${newAcc} · Supplier baru: ${newSup} · Awalan baru: ${newPre}\n\nLangkah berikut: tentukan jenis/aturan dokumen tiap akun (di tab Transaksi pilih akun, atau Data Master › Akun) dan status PKP supplier.`);
  if(newAcc){S.ms='akun';go('master')}else go('transaksi');
}
function exportJson(){flush();dl((S.p.name||'proyek').replace(/[^\w\-]+/g,'_')+'-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(S.p)],{type:'application/json'}))}
async function importJson(f){
  if(!f)return;try{
    const p=JSON.parse(await f.text());if(!p||!p.id||!Array.isArray(p.txs)||!Array.isArray(p.accounts))throw new Error('format backup tidak dikenali');
    migrate(p);
    const ex=S.projects.findIndex(x=>x.id===p.id);
    if(ex>=0){if(!confirm('Proyek “'+S.projects[ex].name+'” sudah ada. Timpa dengan isi backup?'))return;S.projects[ex]=p}else S.projects.push(p);
    S.p=p;reindex();await DB.put(p);await DB.setMeta('last',p.id);toast('Backup dipulihkan');go('beranda');
  }catch(e){alert('Gagal memulihkan: '+e.message)}
}
function wipeTx(){if(!confirm('Hapus SEMUA transaksi dan hasil pemeriksaan di proyek ini? Data master tetap ada.'))return;S.p.txs=[];S.p.printed={};reindex();flush();render()}
async function delProject(){
  if(!confirm('Hapus proyek “'+S.p.name+'” beserta seluruh isinya? Tidak bisa dibatalkan.'))return;
  const id=S.p.id;await DB.del(id);S.projects=S.projects.filter(p=>p.id!==id);
  if(!S.projects.length){const p=newProject('Proyek audit');S.projects.push(p);await DB.put(p)}
  await switchProject(S.projects[0].id);
}
async function switchProject(id){flush();S.p=S.projects.find(p=>p.id===id);reindex();await DB.setMeta('last',id);S.f={q:'',acc:'',st:'',mon:'',sort:'date',lim:100};render()}
async function addProject(){const n=prompt('Nama proyek / perusahaan baru:');if(!n)return;const p=newProject(n.trim());S.projects.push(p);await DB.put(p);await switchProject(p.id);S.tab='master';S.ms='perusahaan';render()}

/* ---- Ekspor Excel ---- */
function exportXlsx(){
  const P=S.p,wb=XLSX.utils.book_new();
  const docTxt=t=>applicableDocs(t).map(d=>d.name+': '+({ada:'ada',tidak:'TIDAK ADA',sebagian:'tidak lengkap'}[t.docs[d.id]]||'belum dicek')).join('; ');
  const stName=s=>(STATUS.find(x=>x[0]===(s||'belum'))||[,'Belum dicek'])[1];
  const row=t=>({Tanggal:t.date,'No bukti':t.no,Keterangan:t.desc,Akun:t.acc,Supplier:t.sup,'Nominal sistem':t.amount,'Nominal nota':t.notaAmount==null?'':t.notaAmount,Selisih:selisih(t)||'',Dokumen:docTxt(t),'Status dokumen':docStatus(t),'Status periksa':stName(t.status),'Ada cetakan':isPrinted(t.no)?'Ya':'Tidak','Wajib cetak':prefixRule(t.no).wajib?'Ya':'Tidak',Catatan:t.note||''});
  const F=P.txs.map(t=>({t,r:reasons(t)})).filter(x=>x.r.length);
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(F.length?F.map(({t,r})=>({...row(t),Alasan:r.join(' | ')})):[{Info:'Tidak ada temuan'}]),'Temuan');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(P.txs.length?P.txs.map(row):[{Info:'Belum ada transaksi'}]),'Checklist');
  const C=[];cetakAnalysis().forEach(o=>{o.belum.forEach(n=>C.push({Awalan:o.p,Jenis:'Ada di buku besar, tidak ada cetakan',Nomor:n}));o.extra.forEach(n=>C.push({Awalan:o.p,Jenis:'Ada cetakan, tidak ada di buku besar',Nomor:n}));o.gaps.forEach(n=>C.push({Awalan:o.p,Jenis:'Nomor loncat',Nomor:n}))});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(C.length?C:[{Info:'Tidak ada temuan nomor cetak'}]),'Nomor cetak');
  const K=Object.keys(P.attendance).sort().map(m=>{const a=P.attendance[m],o={Bulan:m};let t=0;P.kategori.forEach(k=>o[k]=0);P.employees.forEach(e=>{if(a[e.id]){o[e.kat]=(o[e.kat]||0)+1;t++}});o.Total=t;return o});
  if(K.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(K),'Karyawan');
  XLSX.writeFile(wb,'Audit-'+(P.name||'proyek').replace(/[^\w\-]+/g,'_')+'-'+new Date().toISOString().slice(0,10)+'.xlsx');
}

/* ====================== start ====================== */
(async function init(){
  try{
    await DB.open();
    S.projects=await DB.all();
    if(!S.projects.length){const p=newProject('Proyek audit');S.projects.push(p);await DB.put(p)}
    for(const p of S.projects){if(migrate(p))await DB.put(p)}
    const last=await DB.getMeta('last');S.p=S.projects.find(p=>p.id===last)||S.projects[0];reindex();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
  }catch(e){document.body.insertAdjacentHTML('afterbegin','<p style="padding:12px;color:#c0392b">Penyimpanan browser tidak tersedia: '+esc(e.message)+'. Matikan mode privat dan coba lagi.</p>');return}
  render();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
